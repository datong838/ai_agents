# frozen/02 — 7 Pipeline 规格（D0 冻结）

> 上位方案：[228-微商城专项](../228-微商城专项实施准备与FDE全链路规格.md) 第 5 节。
> 落点说明：本文件是**规格文档，非 bundle 资产**。`BundleExports` 是 StrictContract，不支持 pipeline 字段；边界门禁 [test_m5_ecommerce_boundaries.py](../../../../../aos-platform/services/aos-api/tests/asset_registry/test_m5_ecommerce_boundaries.py) 禁止 niushop bundle 携带可执行资产。Pipeline 通过 `/v1/pipelines` 运行时创建到 `meta_pipeline` 表，本规格是 D1 运行时创建的契约依据。
> 本文件已纳入 [frozen/04 差异报告](./04-discovery-report.md) 的修正项。

---

## 通用骨架

每条 Pipeline 统一使用：

```text
Source → TenantFilter(site_id=1) → Normalize → Validate → Deduplicate
       → QualityGate ┬→ Dataset / OT sink
                     └→ DLQ（只存键、错误码与脱敏摘要）
```

通用约束：
- `org_id` / `project_id` 由实施上下文注入（栖月汇：`org-org` / `dev-project`）
- `site_id=1` 是源过滤与 Sink 租户键的一部分
- 唯一键命名空间：`niushop:1:{source_pk}`
- Unix 秒 → UTC，`0` 转 `null`
- 增量游标 `(watermark, primary_key)` 稳定二元组
- D1 不做多表 JOIN Sink（按 P 按 Link 独立落地）

