## 与平台-电商域-微商城三层自洽性

| 层 | 契约来源 | 本规格对齐点 |
|---|---|---|
| 平台（AOS 通用） | `BundleExports` StrictContract / 边界门禁 | Pipeline 不入 bundle，走运行时 `/v1/pipelines` |
| 电商域 | [228-EC-Pipeline 诚实执行](../../228-EC-Pipeline诚实执行与负向验收方案.md) / [228-EC-核心本体](../../228-EC-核心本体与增量一致性方案.md) | 通用骨架、DLQ、QualityGate、7 OT 唯一键、Link 完整性门禁 |
| 微商城 | [228-微商城专项](../228-微商城专项实施准备与FDE全链路规格.md) 第 5 节 | 7 Pipeline 映射、site_id=1、软删过滤、时间转换 |

D1 真实 executor/sink 完成前，本规格仅作为"画布可配置 ≠ 生产可执行"的诚实声明依据。
