## P01 — Shop

| 项 | 值 |
|---|---|
| 源表 / 主键 | `ns_site` / `site_id` |
| 源过滤 | `site_id=1` |
| 增量策略 | 每日快照 |
| 目标 OT | `Shop` |
| 唯一键 | `niushop:1:{site_id}` |
| 校验 | `site_name` 非空 |
| 游标字段 | 无（快照模式） |

## P02 — Product

| 项 | 值 |
|---|---|
| 源表 / 主键 | `ns_goods` / `goods_id` |
| 源过滤 | `site_id=1 AND is_delete=0` |
| 增量游标 | `(modify_time, goods_id)`，`modify_time=0` 回退 `create_time` |
| 目标 OT | `Product` |
| 唯一键 | `niushop:1:{goods_id}` |
| 关键映射 | `price decimal(10,2)` 非负；`goods_state` 枚举 {0,1}；`0` 时间转 null |
| 软删处置 | `is_delete=1`（8 行）不入 OT，进 DLQ 计数 |
| 数据现状 | count=65（含软删），有效 57 |

## P03 — ProductSku

| 项 | 值 |
|---|---|
| 源表 / 主键 | `ns_goods_sku` / `sku_id` |
| 源过滤 | `site_id=1 AND is_delete=0` |
| 增量游标 | `(modify_time, sku_id)`，`modify_time=0` 回退 `create_time` |
| 目标 OT | `ProductSku` |
| 唯一键 | `niushop:1:{sku_id}` |
| 关键映射 | `product_id` 指向 P02；价格/库存非负；孤儿进 DLQ |
| Link | `hasSku: Product → ProductSku (goods_id)` |

## P04 — Category

| 项 | 值 |
|---|---|
| 源表 / 主键 | `ns_goods_category` / `category_id` |
| 源过滤 | `site_id=1` |
| 增量策略 | 每日快照 |
| 目标 OT | `Category` |
| 唯一键 | `niushop:1:{category_id}` |
| 关键校验 | `pid=0` 为根；检测分类环和孤儿父级 |
| Link | `inCategory: Product → Category (category_id)`（多分类字符串需先定义拆分契约） |

## P05 — Order

| 项 | 值 |
|---|---|
| 源表 / 主键 | `ns_order` / `order_id` |
| 源过滤 | `site_id=1 AND is_delete=0` |
| 增量游标 | 初装 `(create_time, order_id)`；每小时重扫最近 7 天；每日全状态对账 |
| 目标 OT | `Order` |
| 唯一键 | `niushop:1:{order_id}` |
| 关键映射 | `order_no`；`member_id` 仅保留关联键（不引 PII）；状态四元组（`order_status`/`pay_status`/`delivery_status`/`is_delete`）；金额 decimal |
| **状态字段修正** | 上位方案写的 `shipping_status` **不存在**，真实字段是 `delivery_status`（见差异报告 D-001） |
| 软删处置 | `is_delete=1`（60 行）不入 OT，进 DLQ 计数 |
| 数据现状 | count=177（含软删），有效 117 |

## P06 — OrderLine

| 项 | 值 |
|---|---|
| 源表 / 主键 | `ns_order_goods` / `order_goods_id` |
| 源过滤 | `site_id=1` |
| **增量游标修正** | 上位方案写 `(create_time, order_goods_id)` **不可用**：`create_time` 227 行全为 0（见差异报告 D-002）。改用 `refund_action_time` 为辅游标，主策略退回**每日快照 + order_id 关联重扫** |
| 目标 OT | `OrderLine` |
| 唯一键 | `niushop:1:{order_goods_id}` |
| 关键映射 | 指向 Order/Product/ProductSku；数量/金额非负；`refund_status` 枚举 {-3,0,3}；`delivery_status` 保留 |
| Link | `contains: Order → OrderLine (order_id)`；`forProduct: OrderLine → Product (goods_id)`；`forSku: OrderLine → ProductSku (sku_id)` |

## P07 — Shipment

| 项 | 值 |
|---|---|
| 源表 / 主键 | `ns_express_delivery_package` / `id` |
| 源过滤 | `site_id=1` |
| 增量策略 | 每日快照（`delivery_time` 可用性核验后可转增量） |
| 目标 OT | `Shipment` |
| 唯一键 | `niushop:1:{id}` |
| 关键映射 | 指向 Order；`delivery_no` 物流号按敏感级别遮罩 |
| Link | `ships: Shipment → Order (order_id)` |
| 数据现状 | count=19 |

