<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工作台 · 发布入口 | AI操作系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/demo.css" />
</head>
<body class="aos-themeable bg-slate-950 text-gray-400 min-h-screen flex">
  <aside class="w-56 shrink-0 border-r border-white/[0.08] bg-slate-900/80 flex flex-col">
    <div class="p-4 border-b border-white/[0.08]">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-sky-400/10 border border-sky-400/20 flex items-center justify-center">
          <svg class="w-4 h-4 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/></svg>
        </div>
        <div>
          <div class="text-gray-100 text-sm font-medium leading-tight">AI操作系统</div>
          <div class="text-gray-500 text-xs leading-snug mt-0.5">AOS 企业AI转型方案</div>
        </div>
      </div>
    </div>
    <nav id="app-nav" class="flex-1 p-3 space-y-0.5 overflow-y-auto"></nav>
    <div class="p-3 border-t border-white/[0.08] text-xs text-gray-500">工作台 · 发布指针</div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-14 border-b border-white/[0.08] flex items-center justify-between px-6">
      <div id="app-breadcrumb" class="flex items-center text-sm"></div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 lg:p-8">
      <div class="max-w-xl mx-auto rounded-xl border border-white/[0.1] bg-slate-900 p-6 space-y-4">

        <p class="text-xs text-gray-500">工作台只提供入口；舰队 / Channel / Asset Bundle 在 Apollo 完成。</p>
        <div class="text-sm space-y-2">
          <div class="text-gray-500 text-xs">目标通道</div>
          <label class="flex items-center gap-2 text-sm"><input type="radio" name="ch" /> 开发 (rc)</label>
          <label class="flex items-center gap-2 text-sm"><input type="radio" name="ch" checked /> 试点 (beta)</label>
          <label class="flex items-center gap-2 text-sm"><input type="radio" name="ch" /> 全量 (stable)</label>
          <label class="flex items-center gap-2 text-sm text-rose-300"><input type="radio" name="ch" /> 紧急 hotfix</label>
        </div>
        <div class="grid sm:grid-cols-2 gap-2 pt-2">
          <a href="apollo-release.html" class="px-3 py-2 rounded-lg bg-emerald-400/15 border border-emerald-400/30 text-xs text-emerald-200 text-center">打开 Release 通道 →</a>

          <a href="workshop-canvas.html" class="px-3 py-2 rounded-lg border border-white/[0.08] text-xs text-center">返回画布</a>
        </div>
        <p class="text-[10px] text-emerald-200/80 border border-emerald-400/20 rounded-lg px-3 py-2 bg-emerald-400/5">Spoke 出站轮询拉 Plan · Lite Spoke 同契约 · 见 Apollo 交付组</p>
      </div>
    </main>

  <script src="assets/demo.js"></script>
  <script>DemoUI.initShell('workshop-publish', [{ href: 'index.html', label: '工作区' }, { href: 'workshop.html', label: '工作台' }, { label: '发布入口' }]);</script>
