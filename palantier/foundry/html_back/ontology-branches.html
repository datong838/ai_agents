<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ontology Branches | AI操作系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/demo.css" />
</head>
<body class="aos-themeable bg-slate-950 text-gray-400 min-h-screen flex">
  <aside class="w-56 shrink-0 border-r border-white/[0.08] bg-slate-900/80 flex flex-col">
    <div class="p-4 border-b border-white/[0.08]">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-violet-400/10 border border-violet-400/20 flex items-center justify-center">
          <svg class="w-4 h-4 text-violet-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="12" r="2"/><path stroke-linecap="round" d="M6 8v8M8 6h5a3 3 0 013 3v0a3 3 0 01-3 3H8"/></svg>
        </div>
        <div>
          <div class="text-gray-100 text-sm font-medium leading-tight">AI操作系统</div>
          <div class="text-gray-500 text-xs leading-snug mt-0.5">AOS 企业AI转型方案</div>
        </div>
      </div>
    </div>
    <nav id="app-nav" class="flex-1 p-3 space-y-0.5 overflow-y-auto"></nav>
    <div class="p-3 border-t border-white/[0.08] text-xs text-gray-500">本体</div>
  </aside>
  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-14 border-b border-white/[0.08] flex items-center justify-between px-6">
      <div id="app-breadcrumb" class="flex items-center text-sm"></div>
      <button class="px-3 py-1.5 rounded-lg bg-violet-400 text-slate-950 text-xs font-medium">+ 新建分支</button>
    </header>
    <main class="flex-1 overflow-y-auto p-6">
      <div class="max-w-4xl mx-auto space-y-4">
        <h1 class="text-lg font-semibold text-gray-100">Ontology Branches</h1>
        <div class="rounded-xl border border-white/[0.08] overflow-hidden">
          <table class="w-full text-sm">
            <thead class="bg-slate-900/80 text-gray-500 text-left">
              <tr>
                <th class="px-4 py-3">分支名</th>
                <th class="px-4 py-3">基于</th>
                <th class="px-4 py-3">Object 变更</th>
                <th class="px-4 py-3">状态</th>
                <th class="px-4 py-3">操作</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-white/[0.06]">
              <tr class="table-row-hover">
                <td class="px-4 py-3 text-gray-100 font-mono">master</td>
                <td class="px-4 py-3">—</td>
                <td class="px-4 py-3">—</td>
                <td class="px-4 py-3 text-emerald-400">生产</td>
                <td class="px-4 py-3 text-gray-500">—</td>
              </tr>
              <tr class="table-row-hover">
                <td class="px-4 py-3 text-gray-100 font-mono">feature/order-v2</td>
                <td class="px-4 py-3">master</td>
                <td class="px-4 py-3">3 Object types</td>
                <td class="px-4 py-3 text-cyan-400">开发中</td>
                <td class="px-4 py-3"><button class="text-violet-300 text-xs mr-2">合并</button><button class="text-gray-400 text-xs">对比</button></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="rounded-xl border border-amber-400/20 bg-amber-400/5 p-4 text-xs text-amber-200/90">
          ⚠ feature/order-v2 的 backing dataset 在 Dataset 分支 <code>dev-orders</code> · 建议同步合并（建议与 Dataset 分支同步）。
        </div>
      </div>
    </main>
  </div>
  <script src="assets/demo.js"></script>
  <script>
    DemoUI.initShell('ontology-branches', [
      { label: '工作区', href: 'index.html' },
      { label: 'Ontology', href: 'ontology.html' },
      { label: 'Branches' }
    ]);
  </script>
</body>
</html>
