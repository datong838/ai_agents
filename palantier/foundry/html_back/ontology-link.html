<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Type · Order → Customer | AI操作系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/demo.css" />
</head>
<body class="aos-themeable bg-slate-950 text-gray-400 min-h-screen flex">
  <aside class="w-56 shrink-0 border-r border-white/[0.08] bg-slate-900/80 flex flex-col">
    <div class="p-4 border-b border-white/[0.08]">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-violet-400/10 border border-violet-400/20 flex items-center justify-center">
          <svg class="w-4 h-4 text-violet-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="12" r="3"/><path d="M9 12h6"/></svg>
        </div>
        <div>
          <div class="text-gray-100 text-sm font-medium leading-tight">AI操作系统</div>
          <div class="text-gray-500 text-xs leading-snug mt-0.5">AOS 企业AI转型方案</div>
        </div>
      </div>
    </div>
    <nav id="app-nav" class="flex-1 p-3 space-y-0.5 overflow-y-auto"></nav>
    <div class="p-3 border-t border-white/[0.08] text-xs text-gray-500">本体</div>
  </aside>
  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-14 border-b border-white/[0.08] flex items-center justify-between px-6">
      <div id="app-breadcrumb" class="flex items-center text-sm"></div>
      <div class="flex gap-2">
        <a href="ontology-object.html?tab=links" class="px-3 py-1.5 rounded-lg border border-white/[0.08] text-xs">取消</a>
        <button class="px-3 py-1.5 rounded-lg bg-violet-400 text-slate-950 text-xs font-medium">保存 Link</button>
      </div>
    </header>
    <main class="flex-1 overflow-y-auto p-6">
      <div class="max-w-xl mx-auto space-y-6">
        <h1 class="text-lg font-semibold text-gray-100">Link: Order → Customer</h1>
        <div class="rounded-lg border border-rose-400/30 bg-rose-400/5 px-4 py-3 text-xs text-rose-200/90">
          ⚠ <strong>解法 B 红线：</strong>Link 边数 &gt;100 万须升级为 MDO（多数据源对象），禁止裸 Link 承载海量边。
        </div>
        <div class="rounded-lg border border-amber-400/30 bg-amber-400/5 px-4 py-3 text-xs text-amber-200/90">
          ⚠ <strong>解法 C 禁则：</strong>Link 属性不得作高频筛选主字段；筛选请用 Object Property 或宽表 Join。
        </div>
        <div class="rounded-xl border border-white/[0.08] bg-slate-900/50 p-5 space-y-4 text-sm">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs text-gray-500">左 Object (From)</label>
              <select class="mt-1 w-full rounded-lg bg-slate-950 border border-white/[0.08] px-3 py-2"><option selected>Order</option></select>
            </div>
            <div>
              <label class="text-xs text-gray-500">右 Object (To)</label>
              <select class="mt-1 w-full rounded-lg bg-slate-950 border border-white/[0.08] px-3 py-2"><option selected>Customer</option></select>
            </div>
          </div>
          <div>
            <label class="text-xs text-gray-500">基数</label>
            <div class="flex gap-4 mt-2 text-xs">
              <label><input type="radio" name="card" /> 1:1</label>
              <label><input type="radio" name="card" checked /> N:1</label>
              <label><input type="radio" name="card" /> N:M</label>
            </div>
          </div>
          <div>
            <label class="text-xs text-gray-500">外键映射</label>
            <p class="mt-2 font-mono text-xs text-gray-300">Order.customer_id → Customer.customer_id (PK)</p>
          </div>
        </div>
        <div class="rounded-xl border border-white/[0.08] p-6 text-center font-mono text-sm text-gray-300">
          [Customer] ◄──── places ──── [Order]
        </div>
        <p class="text-xs text-gray-500">解法 B：跨域备选；同域多源首选 L1 Join 宽表（解法 A）。</p>
      </div>
    </main>
  </div>
  <script src="assets/demo.js"></script>
  <script>
    DemoUI.initShell('ontology', [
      { label: '工作区', href: 'index.html' },
      { label: 'Ontology', href: 'ontology.html' },
      { label: 'Order', href: 'ontology-object.html' },
      { label: 'Link' }
    ]);
  </script>
</body>
</html>
