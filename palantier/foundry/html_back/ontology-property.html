<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property · amount | AI操作系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/demo.css" />
</head>
<body class="aos-themeable bg-slate-950 text-gray-400 min-h-screen flex">
  <aside class="w-56 shrink-0 border-r border-white/[0.08] bg-slate-900/80 flex flex-col">
    <div class="p-4 border-b border-white/[0.08]">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-violet-400/10 border border-violet-400/20 flex items-center justify-center">
          <svg class="w-4 h-4 text-violet-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 8h16M4 16h10"/><rect x="3" y="5" width="18" height="14" rx="1"/></svg>
        </div>
        <div>
          <div class="text-gray-100 text-sm font-medium leading-tight">AI操作系统</div>
          <div class="text-gray-500 text-xs leading-snug mt-0.5">AOS 企业AI转型方案</div>
        </div>
      </div>
    </div>
    <nav id="app-nav" class="flex-1 p-3 space-y-0.5 overflow-y-auto"></nav>
    <div class="p-3 border-t border-white/[0.08] text-xs text-gray-500">本体</div>
  </aside>
  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-14 border-b border-white/[0.08] flex items-center justify-between px-6 shrink-0">
      <div id="app-breadcrumb" class="flex items-center text-sm"></div>
      <div class="flex gap-2">
        <a href="ontology-object.html?tab=properties" class="px-3 py-1.5 rounded-lg border border-white/[0.08] text-xs">取消</a>
        <button class="px-3 py-1.5 rounded-lg bg-violet-400 text-slate-950 text-xs font-medium">保存 Property</button>
      </div>
    </header>
    <main class="flex-1 overflow-y-auto p-6">
      <div class="max-w-xl mx-auto space-y-6">
        <h1 class="text-lg font-semibold text-gray-100">Property: amount</h1>
        <div class="rounded-xl border border-white/[0.08] bg-slate-900/50 p-5 space-y-4 text-sm">
          <div>
            <label class="text-xs text-gray-500">显示名</label>
            <input value="订单金额" class="mt-1 w-full rounded-lg bg-slate-950 border border-white/[0.08] px-3 py-2 text-gray-200" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs text-gray-500">API 名</label>
              <input value="amount" class="mt-1 w-full rounded-lg bg-slate-950 border border-white/[0.08] px-3 py-2 font-mono text-gray-200" />
            </div>
            <div>
              <label class="text-xs text-gray-500">类型</label>
              <select class="mt-1 w-full rounded-lg bg-slate-950 border border-white/[0.08] px-3 py-2 text-gray-200"><option selected>Double</option><option>String</option><option>Integer</option></select>
            </div>
          </div>
          <div class="border-t border-white/[0.06] pt-4">
            <div class="text-xs text-gray-500 mb-2">Backing Dataset（只读 · Data Tab 修改）</div>
            <p class="font-mono text-cyan-400 text-xs">curated_orders</p>
            <label class="text-xs text-gray-500 mt-3 block">Backing Column</label>
            <select class="mt-1 w-full rounded-lg bg-slate-950 border border-white/[0.08] px-3 py-2 font-mono text-gray-200"><option selected>amount</option><option>amt</option></select>
            <div class="flex gap-4 mt-3 text-xs">
              <label class="flex items-center gap-2"><input type="checkbox" /> Title Key</label>
              <label class="flex items-center gap-2"><input type="checkbox" /> Primary Key</label>
              <label class="flex items-center gap-2"><input type="checkbox" /> 时间序列 TSP</label>
            </div>
          </div>
        </div>
        <div class="rounded-xl border border-emerald-400/20 bg-emerald-400/5 p-4 text-xs space-y-2">
          <div class="text-emerald-400 font-medium">🟣 OKF Lint 预览</div>
          <p>✅ L1 列 amount (double) ↔ L2 Double 类型一致</p>
          <p class="text-amber-300">⚠ 样本 3 行含 "N/A" — Funnel 将丢弃并记入 Data Health</p>
        </div>
      </div>
    </main>
  </div>
  <script src="assets/demo.js"></script>
  <script>
    DemoUI.initShell('ontology', [
      { label: '工作区', href: 'index.html' },
      { label: 'Ontology', href: 'ontology.html' },
      { label: 'Order', href: 'ontology-object.html' },
      { label: 'amount' }
    ]);
  </script>
</body>
</html>
