<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新建数据源 | AI操作系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/demo.css" />
</head>
<body class="aos-themeable bg-slate-950 text-gray-400 min-h-screen flex">
  <aside class="w-56 shrink-0 border-r border-white/[0.08] bg-slate-900/80 flex flex-col">
    <div class="p-4 border-b border-white/[0.08]">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-cyan-400/10 border border-cyan-400/20 flex items-center justify-center">
          <svg class="w-4 h-4 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" d="M4 7h16M4 12h10M4 17h7"/></svg>
        </div>
        <div>
          <div class="text-gray-100 text-sm font-medium leading-tight">AI操作系统</div>
          <div class="text-gray-500 text-xs leading-snug mt-0.5">AOS 企业AI转型方案</div>
        </div>
      </div>
    </div>
    <nav id="app-nav" class="flex-1 p-3 space-y-0.5 overflow-y-auto"></nav>
    <div class="p-3 border-t border-white/[0.08] text-xs text-gray-500">数据集成 · v1.4</div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-14 border-b border-white/[0.08] bg-slate-950/90 backdrop-blur flex items-center justify-between px-6 shrink-0">
      <div id="app-breadcrumb" class="flex items-center text-sm"></div>
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-cyan-400/30 to-sky-500/20 border border-white/[0.08]"></div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 lg:p-8">
      <div class="max-w-3xl mx-auto space-y-8">
        <div>
          <h1 class="text-xl font-semibold text-gray-100">新建数据源</h1>
          <p class="mt-1 text-sm text-gray-500">配置连接器、运行时与凭证，将外部系统接入谛听 Lakehouse。</p>
        </div>

        <!-- Step indicator -->
        <div class="flex items-center gap-2">
          <div class="flex items-center gap-2">
            <span class="w-7 h-7 rounded-full bg-cyan-400 text-slate-950 text-xs font-semibold flex items-center justify-center">1</span>
            <span class="text-sm text-gray-100">连接器</span>
          </div>
          <div class="flex-1 h-px bg-white/[0.08]"></div>
          <div class="flex items-center gap-2">
            <span class="w-7 h-7 rounded-full bg-slate-800 border border-white/[0.08] text-xs flex items-center justify-center">2</span>
            <span class="text-sm text-gray-500">运行时</span>
          </div>
          <div class="flex-1 h-px bg-white/[0.08]"></div>
          <div class="flex items-center gap-2">
            <span class="w-7 h-7 rounded-full bg-slate-800 border border-white/[0.08] text-xs flex items-center justify-center">3</span>
            <span class="text-sm text-gray-500">连接</span>
          </div>
          <div class="flex-1 h-px bg-white/[0.08]"></div>
          <div class="flex items-center gap-2">
            <span class="w-7 h-7 rounded-full bg-slate-800 border border-white/[0.08] text-xs flex items-center justify-center">4</span>
            <span class="text-sm text-gray-500">凭证</span>
          </div>
        </div>

        <!-- Step 1: Connectors -->
        <section class="space-y-4">
          <h2 class="text-sm font-medium text-gray-100">选择连接器类型</h2>
          <p class="text-xs text-gray-500">P0 文件类型优先 · P1 JDBC/MySQL 结构化入库</p>
          <div class="grid grid-cols-2 gap-4">
            <label class="cursor-pointer rounded-xl border-2 border-emerald-400/40 bg-emerald-400/5 p-4 transition-colors relative">
              <span class="absolute top-2 right-2 text-[10px] px-1.5 py-0.5 rounded bg-emerald-400/20 text-emerald-300 border border-emerald-400/30">P0</span>
              <input type="radio" name="connector" value="files" class="sr-only" />
              <div class="flex items-start gap-3">
                <div class="w-10 h-10 rounded-lg bg-emerald-400/10 border border-emerald-400/20 flex items-center justify-center shrink-0">
                  <svg class="w-5 h-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg>
                </div>
                <div>
                  <div class="text-gray-100 font-medium">文件 · 文档</div>
                  <div class="text-xs text-gray-500 mt-1">Word · Excel · PDF · md · txt · csv</div>
                </div>
              </div>
            </label>
            <label class="cursor-pointer rounded-xl border-2 border-cyan-400/50 bg-cyan-400/5 p-4 transition-colors relative">
              <span class="absolute top-2 right-2 text-[10px] px-1.5 py-0.5 rounded bg-cyan-400/20 text-cyan-300 border border-cyan-400/30">P1</span>
              <input type="radio" name="connector" value="jdbc" checked class="sr-only" />
              <div class="flex items-start gap-3">
                <div class="w-10 h-10 rounded-lg bg-sky-400/10 border border-sky-400/20 flex items-center justify-center shrink-0">
                  <svg class="w-5 h-5 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.66 3.58 3 8 3s8-1.34 8-3V6"/><path d="M4 12v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/></svg>
                </div>
                <div>
                  <div class="text-gray-100 font-medium">JDBC · MySQL</div>
                  <div class="text-xs text-gray-500 mt-1">MySQL · PostgreSQL · Oracle</div>
                </div>
              </div>
            </label>
            <label class="cursor-pointer rounded-xl border border-white/[0.08] bg-slate-900 p-4 hover:border-cyan-400/30 transition-colors">
              <input type="radio" name="connector" value="s3" class="sr-only" />
              <div class="flex items-start gap-3">
                <div class="w-10 h-10 rounded-lg bg-amber-400/10 border border-amber-400/20 flex items-center justify-center shrink-0">
                  <svg class="w-5 h-5 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                </div>
                <div>
                  <div class="text-gray-100 font-medium">Amazon S3</div>
                  <div class="text-xs text-gray-500 mt-1">对象存储 · 批量文件</div>
                </div>
              </div>
            </label>
            <label class="cursor-pointer rounded-xl border border-white/[0.08] bg-slate-900 p-4 hover:border-cyan-400/30 transition-colors">
              <input type="radio" name="connector" value="kafka" class="sr-only" />
              <div class="flex items-start gap-3">
                <div class="w-10 h-10 rounded-lg bg-purple-400/10 border border-purple-400/20 flex items-center justify-center shrink-0">
                  <svg class="w-5 h-5 text-purple-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <div>
                  <div class="text-gray-100 font-medium">Apache Kafka</div>
                  <div class="text-xs text-gray-500 mt-1">流式 · Schema Registry</div>
                </div>
              </div>
            </label>
            <label class="cursor-pointer rounded-xl border border-white/[0.08] bg-slate-900 p-4 hover:border-cyan-400/30 transition-colors">
              <input type="radio" name="connector" value="rest" class="sr-only" />
              <div class="flex items-start gap-3">
                <div class="w-10 h-10 rounded-lg bg-emerald-400/10 border border-emerald-400/20 flex items-center justify-center shrink-0">
                  <svg class="w-5 h-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                </div>
                <div>
                  <div class="text-gray-100 font-medium">REST API</div>
                  <div class="text-xs text-gray-500 mt-1">HTTP · OAuth · 分页</div>
                </div>
              </div>
            </label>
          </div>
        </section>

        <!-- Step 2: Runtime -->
        <section class="space-y-4">
          <h2 class="text-sm font-medium text-gray-100">运行时模式</h2>
          <div class="space-y-3">
            <label class="flex items-start gap-3 rounded-xl border border-white/[0.08] bg-slate-900 p-4 cursor-pointer hover:border-cyan-400/30 transition-colors">
              <input type="radio" name="runtime" value="direct" class="mt-1 accent-cyan-400" />
              <div>
                <div class="text-gray-100 font-medium">直接连接</div>
                <div class="text-xs text-gray-500 mt-1">Foundry 云端直连源系统，适用于公网可达的数据库与 API。</div>
              </div>
            </label>
            <label class="flex items-start gap-3 rounded-xl border-2 border-cyan-400/50 bg-cyan-400/5 p-4 cursor-pointer">
              <input type="radio" name="runtime" value="agent" checked class="mt-1 accent-cyan-400" />
              <div>
                <div class="text-gray-100 font-medium">代理连接</div>
                <div class="text-xs text-gray-500 mt-1">通过部署在 VPC 内的 <a href="agents.html" class="text-cyan-400 hover:underline">Magritte Agent</a> 安全隧道接入内网数据源。</div>
              </div>
            </label>
            <label class="flex items-start gap-3 rounded-xl border border-white/[0.08] bg-slate-900 p-4 cursor-pointer hover:border-cyan-400/30 transition-colors">
              <input type="radio" name="runtime" value="worker" class="mt-1 accent-cyan-400" />
              <div>
                <div class="text-gray-100 font-medium">代理工作者</div>
                <div class="text-xs text-gray-500 mt-1">Agent 集群中的专用 Worker 节点执行高吞吐批量同步任务。</div>
              </div>
            </label>
          </div>
        </section>

        <!-- Step 3: Connection -->
        <section class="space-y-4">
          <h2 class="text-sm font-medium text-gray-100">连接配置</h2>
          <div class="rounded-xl border border-white/[0.08] bg-slate-900 p-5 space-y-4">
            <div>
              <label class="block text-xs text-gray-500 mb-1.5">数据源名称</label>
              <input type="text" value="prod-mysql-orders" class="w-full rounded-lg bg-slate-950 border border-white/[0.08] px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-cyan-400/40" />
            </div>
            <div>
              <label class="block text-xs text-gray-500 mb-1.5">JDBC URL</label>
              <input type="text" value="jdbc:mysql://10.0.12.45:3306/ecom_orders" class="w-full rounded-lg bg-slate-950 border border-white/[0.08] px-3 py-2 text-sm text-gray-300 font-mono focus:outline-none focus:border-cyan-400/40" />
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs text-gray-500 mb-1.5">主机</label>
                <input type="text" value="10.0.12.45" class="w-full rounded-lg bg-slate-950 border border-white/[0.08] px-3 py-2 text-sm text-gray-300 focus:outline-none focus:border-cyan-400/40" />
              </div>
              <div>
                <label class="block text-xs text-gray-500 mb-1.5">端口</label>
                <input type="text" value="3306" class="w-full rounded-lg bg-slate-950 border border-white/[0.08] px-3 py-2 text-sm text-gray-300 focus:outline-none focus:border-cyan-400/40" />
              </div>
            </div>
            <div>
              <label class="block text-xs text-gray-500 mb-1.5">指派代理</label>
              <select class="w-full rounded-lg bg-slate-950 border border-white/[0.08] px-3 py-2 text-sm text-gray-300 focus:outline-none focus:border-cyan-400/40">
                <option>agent-prod-1 (在线)</option>
                <option>agent-prod-2 (在线)</option>
                <option>agent-staging-1 (离线)</option>
              </select>
            </div>
          </div>
        </section>

        <!-- Step 4: Credentials -->
        <section class="space-y-4">
          <h2 class="text-sm font-medium text-gray-100">凭证</h2>
          <div class="rounded-xl border border-white/[0.08] bg-slate-900 p-5 space-y-4">
            <div>
              <label class="block text-xs text-gray-500 mb-1.5">用户名</label>
              <input type="text" value="foundry_reader" class="w-full rounded-lg bg-slate-950 border border-white/[0.08] px-3 py-2 text-sm text-gray-300 focus:outline-none focus:border-cyan-400/40" />
            </div>
            <div>
              <label class="block text-xs text-gray-500 mb-1.5">密码</label>
              <input type="password" value="••••••••••••" class="w-full rounded-lg bg-slate-950 border border-white/[0.08] px-3 py-2 text-sm text-gray-300 focus:outline-none focus:border-cyan-400/40" />
            </div>
            <div class="flex items-center gap-2 text-xs text-gray-500">
              <svg class="w-4 h-4 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
              凭证将加密存储于 Foundry Secrets Manager
            </div>
          </div>
        </section>

        <!-- Actions -->
        <div class="flex items-center justify-between pt-4 border-t border-white/[0.08]">
          <a href="data-connection.html" class="px-4 py-2 rounded-lg border border-white/[0.08] text-sm text-gray-300 hover:bg-white/[0.04] transition-colors">取消</a>
          <a href="source-detail.html" class="btn-primary px-6 py-2 rounded-lg bg-cyan-400 text-slate-950 text-sm font-medium hover:bg-cyan-300 shadow-lg shadow-cyan-400/10">创建数据源</a>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/demo.js"></script>
  <script>
    DemoUI.initShell('data-connection', [
      { label: '工作区', href: 'index.html' },
      { label: '数据连接', href: 'data-connection.html' },
      { label: '新建数据源' }
    ]);
  </script>
</body>
</html>
