<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>同步配置 | AI操作系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/demo.css" />
</head>
<body class="aos-themeable bg-slate-950 text-gray-400 min-h-screen flex">
  <aside class="w-56 shrink-0 border-r border-white/[0.08] bg-slate-900/80 flex flex-col">
    <div class="p-4 border-b border-white/[0.08]">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-cyan-400/10 border border-cyan-400/20 flex items-center justify-center">
          <svg class="w-4 h-4 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" d="M4 7h16M4 12h10M4 17h7"/></svg>
        </div>
        <div>
          <div class="text-gray-100 text-sm font-medium leading-tight">AI操作系统</div>
          <div class="text-gray-500 text-xs leading-snug mt-0.5">AOS 企业AI转型方案</div>
        </div>
      </div>
    </div>
    <nav id="app-nav" class="flex-1 p-3 space-y-0.5 overflow-y-auto"></nav>
    <div class="p-3 border-t border-white/[0.08] text-xs text-gray-500">数据集成</div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-14 border-b border-white/[0.08] bg-slate-950/90 backdrop-blur flex items-center justify-between px-6 shrink-0">
      <div id="app-breadcrumb" class="flex items-center text-sm"></div>
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-cyan-400/30 to-sky-500/20 border border-white/[0.08]"></div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 lg:p-8">
      <div class="max-w-3xl mx-auto space-y-6">
        <div>
          <h1 class="text-xl font-semibold text-gray-100" data-sync-title>创建同步</h1>
          <p class="mt-1 text-sm text-gray-500" id="sync-subtitle">配置存储目标 · 源端 · 计划</p>
        </div>

        <div class="rounded-xl border border-white/[0.08] bg-slate-900 p-6 space-y-6">
          <!-- 同步类型 -->
          <div>
            <label class="block text-xs text-gray-500 mb-2">同步类型</label>
            <div class="flex flex-wrap gap-3 text-sm">
              <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="sync-type" checked class="text-cyan-400" /> 批量</label>
              <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="sync-type" /> 流式</label>
              <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="sync-type" /> 变更捕获 (CDC)</label>
              <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="sync-type" id="sync-type-media" /> 媒体集</label>
            </div>
          </div>

          
          <div class="rounded-lg border border-cyan-400/20 bg-cyan-400/5 p-4 space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-xs font-medium text-cyan-400 uppercase tracking-wide">存储目标</span>
              <a href="sync-routing.html" class="text-xs text-cyan-400 hover:underline">← 重新选择路由</a>
            </div>
            <div class="grid sm:grid-cols-2 gap-4 text-sm">
              <div><span class="text-gray-500 text-xs block mb-1">目标类型</span><span class="text-gray-100" data-sync-target>数据集</span></div>
              <div><span class="text-gray-500 text-xs block mb-1">解析路径</span><span class="text-gray-100" data-sync-path>结构化 · Apply Schema</span></div>
            </div>
            <div>
              <label class="block text-xs text-gray-500 mb-1.5">目标路径</label>
              <input type="text" id="target-path" value="/Raw/Ecom/orders" class="w-full rounded-lg bg-slate-950 border border-white/[0.08] px-3 py-2 text-sm text-gray-300 font-mono focus:outline-none focus:border-cyan-400/40" />
            </div>
            <div class="grid sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs text-gray-500 mb-1.5">分层标签</label>
                <select class="w-full rounded-lg bg-slate-950 border border-white/[0.08] px-3 py-2 text-sm text-gray-300">
                  <option>贴源层 ODS</option><option>缓冲层</option><option>自动</option>
                </select>
              </div>
              <div>
                <label class="block text-xs text-gray-500 mb-1.5">物理格式</label>
                <input type="text" id="target-format" value="Text / CSV" readonly class="w-full rounded-lg bg-slate-950/50 border border-white/[0.08] px-3 py-2 text-sm text-gray-400" />
              </div>
            </div>
          </div>

          <!-- 源端 -->
          <div id="source-table-section">
            <label class="block text-xs text-gray-500 mb-1.5">源表 / 查询</label>
            <input type="text" value="ecom_orders.orders" class="w-full rounded-lg bg-slate-950 border border-white/[0.08] px-3 py-2 text-sm text-gray-300 font-mono" />
          </div>
          <div id="source-file-section" class="hidden">
            <label class="block text-xs text-gray-500 mb-1.5">文件路径筛选</label>
            <input type="text" value="/Maintenance/Scans/**/*.pdf" class="w-full rounded-lg bg-slate-950 border border-white/[0.08] px-3 py-2 text-sm text-gray-300 font-mono" />
          </div>

          <div>
            <label class="block text-xs text-gray-500 mb-1.5">事务类型</label>
            <select id="txn-type" class="w-full rounded-lg bg-slate-950 border border-white/[0.08] px-3 py-2 text-sm text-gray-300">
              <option selected>SNAPSHOT — 全量快照</option>
              <option>APPEND — 增量追加</option>
            </select>
          </div>

          <div>
            <label class="block text-xs text-gray-500 mb-1.5">调度</label>
            <select class="w-full rounded-lg bg-slate-950 border border-white/[0.08] px-3 py-2 text-sm text-gray-300">
              <option>每小时</option><option selected>每日 02:00 UTC</option><option>手动触发</option>
            </select>
            <a href="schedules.html" class="inline-block mt-2 text-xs text-cyan-400 hover:underline">打开计划编辑器 →</a>
          </div>
        </div>

        <div class="flex items-center justify-between">
          <a id="sync-back" href="source-detail.html" class="px-4 py-2 rounded-lg border border-white/[0.08] text-sm text-gray-300 hover:bg-white/[0.04]">返回</a>
          <div class="flex gap-3">
            <button class="px-4 py-2 rounded-lg border border-white/[0.08] text-sm text-gray-300 hover:bg-white/[0.04]">保存配置</button>
            <a id="sync-run" href="dataset.html?raw=1" class="btn-primary px-6 py-2 rounded-lg bg-cyan-400 text-slate-950 text-sm font-medium hover:bg-cyan-300 shadow-lg shadow-cyan-400/10">立即运行</a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/demo.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const target = params.get('target') || 'dataset';
    const source = params.get('source') || 'mysql';
    const pathEl = document.getElementById('target-path');
    const formatEl = document.getElementById('target-format');
    const runEl = document.getElementById('sync-run');
    const backEl = document.getElementById('sync-back');
    const tableSec = document.getElementById('source-table-section');
    const fileSec = document.getElementById('source-file-section');
    const mediaRadio = document.getElementById('sync-type-media');

    DemoUI.applySyncRoutingParams();

    if (target.startsWith('media')) {
      if (mediaRadio) mediaRadio.checked = true;
      tableSec.classList.add('hidden');
      fileSec.classList.remove('hidden');
      pathEl.value = target === 'media_sheet' ? '/Media/Maintenance/spreadsheets' : '/Media/Maintenance/scans';
      formatEl.value = target === 'media_sheet' ? 'Spreadsheet · XLSX' : 'Document · PDF';
      runEl.href = 'media-sets.html';
      backEl.href = 'source-detail.html?source=docs';
      document.querySelector('[data-sync-title]').textContent = '创建媒体集同步';
    } else if (target === 'stream') {
      pathEl.value = '/Streaming/IoT/sensors';
      formatEl.value = 'Avro · Stream';
      runEl.href = 'dataset.html?raw=1';
    } else {
      backEl.href = source === 'docs' ? 'source-detail.html?source=docs' : 'source-detail.html';
    }

    const bcSource = source === 'docs' ? 'sharepoint-maintenance-docs' : 'prod-mysql-orders';
    DemoUI.initShell('data-connection', [
      { label: '工作区', href: 'index.html' },
      { label: '数据连接', href: 'data-connection.html' },
      { label: bcSource, href: backEl.href },
      { label: '同步配置' }
    ]);
  </script>
</body>
</html>
